name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck bin/* tests/*.sh

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tests (macOS runs them with /bin/bash 3.2 on purpose)
        env:
          TEST_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || 'bash' }}
        run: tests/run.sh
